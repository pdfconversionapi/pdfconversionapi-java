# Tests on every push and pull request. Expects this SDK at the repository root, with a copy of the
# shared conformance suite (https://github.com/pdfconversionapi/sdk-conformance) in conformance/;
# the jobs fail without it. Live tests skip: they need the API's address and a key, which CI
# doesn't have.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PDFCONVERSIONAPI_CONFORMANCE_DIR: ${{ github.workspace }}/conformance

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21", "25"]
    steps:
      - uses: actions/checkout@v4
      - name: Check that the conformance suite is in the repository
        run: |
          test -f conformance/cases.json && test -f conformance/mock-server.mjs || {
            echo "::error::conformance/ is missing: this repository keeps a copy of the shared test suite (https://github.com/pdfconversionapi/sdk-conformance) there"
            exit 1
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-node@v4 # runs conformance/mock-server.mjs
        with:
          node-version: "22"
      - name: Build and test (-Xlint:all -Werror, unit and conformance tests)
        run: mvn -B -ntp verify

  kotlin-and-docs:
    name: Kotlin, javadoc and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the conformance suite is in the repository
        run: |
          test -f conformance/cases.json && test -f conformance/mock-server.mjs || {
            echo "::error::conformance/ is missing: this repository keeps a copy of the shared test suite (https://github.com/pdfconversionapi/sdk-conformance) there"
            exit 1
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kotlin tests
        run: mvn -B -ntp -Pkotlin test
      - name: Javadoc (doclint) and sources jars, unsigned
        run: mvn -B -ntp -Prelease -DskipTests package
